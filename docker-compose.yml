version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portofelvirtual-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portofelvirtual
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: portofel_virtual_secure_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portofelvirtual"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portofelvirtual-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: portofelvirtual
      DB_USER: postgres
      DB_PASSWORD: portofel_virtual_secure_2024
      JWT_SECRET: portofel_virtual_jwt_secret_key_2024
      PORT: 3001
      CORS_ORIGIN: http://localhost
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: portofelvirtual-fastapi
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:portofel_virtual_secure_2024@postgres:5432/portofelvirtual
      JWT_SECRET: portofel_virtual_jwt_secret_key_2024
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: 7
      FASTAPI_PORT: 9000
      FASTAPI_HOST: 0.0.0.0
      CORS_ORIGINS: "*"
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: portofelvirtual-frontend
    restart: unless-stopped
    ports:
      - "8889:80"
    depends_on:
      - backend
      - fastapi

volumes:
  postgres_data: